[workspace]
resolver = "3"
members = ["crates/*"]
# Claude Code leaves an empty .claude folder in a directory a session worked from.
exclude = ["crates/.claude"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# std's File::lock, which the locking rests on, is stable from 1.89. CI builds at exactly this version.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
maitred-core = { path = "crates/maitred-core" }
maitred-scenario = { path = "crates/maitred-scenario" }
maitred-sim = { path = "crates/maitred-sim" }
# Class rules: linear-time patterns, so a pattern can't hang a supervisor.
regex = "1.13.1"
# Class rules: `env -S` splits its string with the shell's quoting rules, as the spotter will.
shell-words = "1.1.1"
# Every JSON file, and OTLP's JSON shape.
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: a figure reads back as exactly the figure written.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# Test-only: the OTLP types are checked against the protocol's own.
opentelemetry-proto = { version = "0.33.0", default-features = false, features = ["gen-tonic-messages", "metrics", "with-serde"] }
# Test-only: property tests of decide, choose_victim and the spotter.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
print_stderr = "warn"
